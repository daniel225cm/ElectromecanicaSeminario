<div class="auth-page">
  <div class="auth-card">
    <div class="brand-box">
      <i class="fa-solid fa-screwdriver-wrench"></i>
      <h1>Electromecánica Seminario</h1>
      <p>Sistema de Gestión de Taller</p>
    </div>

    <form (ngSubmit)="iniciarSesion()">
      <div class="mb-3">
        <label class="form-label">Correo electrónico</label>
        <input
          type="email"
          class="form-control"
          [(ngModel)]="correo"
          name="correo"
          placeholder="admin@seminario.com"
        />
      </div>

      <div class="mb-3">
        <label class="form-label">Contraseña</label>
        <input
          type="password"
          class="form-control"
          [(ngModel)]="password"
          name="password"
          placeholder="Ingrese su contraseña"
        />
      </div>

      <button class="btn btn-primary w-100" type="submit" [disabled]="cargando">
        {{ cargando ? 'Ingresando...' : 'Iniciar sesión' }}
      </button>
    </form>

    <div class="auth-link">
      <span>¿No tienes una cuenta?</span>
      <a routerLink="/register">Crear usuario</a>
    </div>
  </div>
</div>
